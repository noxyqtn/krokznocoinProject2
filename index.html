<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b; 
            --dot-color: #8b5cf6; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: transparent; 
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Sfondo a pallini viola */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            z-index: 1; 
            pointer-events: none;
        }

        /* Finestra principale */
        .window-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; height: 85vh;
            max-width: 1400px; max-height: 850px;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            z-index: 10; 
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh;
            max-width: 100%; max-height: 100%;
            border-radius: 0; border: none;
        }

        /* Contenitore del gioco */
        #gameContainer {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 1 !important;
            overflow: hidden !important;
        }

        #gameContainer canvas, 
        #game-container { 
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: contain !important;
            outline: none !important;
            display: block !important;
            margin: 0 !important; padding: 0 !important;
            z-index: 1 !important;
        }

        /* --- SCHERMATA DI CARICAMENTO --- */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; /* Sfondo scuro per coprire il grigio di Unity */
            z-index: 50;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
            color: white;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Animazione Rotella */
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--dot-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #a1a1aa;
            animation: pulse 1.5s infinite alternate;
        }
        
        .loading-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        
        .loading-title span { color: var(--dot-color); }

        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; 
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 20px;
            color: var(--text-color);
            pointer-events: auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: lowercase;
            display: flex;
            gap: 6px;
        }
        
        .logo .highlight { color: var(--dot-color); }

        .btn-fullscreen {
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: white;
        }

        .btn-fullscreen:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-fullscreen svg { width: 20px; height: 20px; fill: currentColor; }
    </style>

    <script type="text/javascript" src="4399.js"></script>
    <script>
        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers',
            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build/SanFrancisco.json',
            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693
            }
        };
    </script>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="window-container" id="windowContainer">
        
        <!-- SCHERMATA DI CARICAMENTO (in inglese) -->
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-title">krokz<span> no coin</span></div>
            <div class="spinner"></div>
            <div class="loading-text">Loading Game...</div>
        </div>

        <div id="gameContainer" tabindex="0"></div>

        <div class="ui-overlay">
            <div class="glass-panel logo">
                krokz <span class="highlight">no coin</span>
            </div>
            <button class="btn-fullscreen glass-panel" id="fullscreenBtn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const loadingScreen = document.getElementById('loadingScreen');

        // 1. Logica Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 350);
        });

        // 2. Gestione del Caricamento e Focus
        let attempts = 0;
        const gameCheckInterval = setInterval(() => {
            attempts++;
            const canvas = document.querySelector('canvas');
            
            if (canvas) {
                // Appena il canvas esiste, diamo il focus
                if (!canvas.hasAttribute('data-focus-init')) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.setAttribute('data-focus-init', 'true');
                    canvas.focus();
                    canvas.addEventListener('mousedown', () => canvas.focus());
                }

                // Se il gioco ha caricato (diamo 2.5 secondi di buffer per far disegnare il menu)
                if (attempts > 5 && !loadingScreen.classList.contains('hidden')) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        if(loadingScreen) loadingScreen.remove();
                    }, 600); // Rimuove dal DOM dopo la transizione CSS
                }
            }

            // Anti-sbordo della finestra
            const unityWrapper = document.getElementById('game-container');
            if (unityWrapper && unityWrapper.parentElement !== gameContainer) {
                gameContainer.appendChild(unityWrapper);
            }
            
            // Fermiamo il loop dopo 15 secondi
            if (attempts > 30) clearInterval(gameCheckInterval);
        }, 500);
    </script>
</body>
</html>
