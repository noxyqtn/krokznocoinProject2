<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krokz No Coin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root {
            --glass-bg: rgba(20, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), inset 0 0 0 1px var(--glass-border);
            --accent: #a78bfa;
        }
        
        /* Sfondo scuro per far risaltare la finestra */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background: #09090b; font-family: 'Inter', sans-serif; user-select: none; 
            display: flex; justify-content: center; align-items: center; 
        }

        /* L'effetto alone viola dietro la finestra */
        body::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vh; background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        /* LA FINESTRA (Ora è nera, non più sfocata) */
        .glass-window {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1600px;
            max-height: 900px;
            background: #000; /* Sfondo nero per il gioco */
            border: 1px solid var(--glass-border); /* Bordo in vetro */
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Stato Fullscreen */
        .glass-window.fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        /* CONTENITORE DEL GIOCO - Bloccato dentro la finestra */
        #gameContainer { 
            position: absolute !important; 
            top: 0 !important; left: 0 !important; 
            width: 100% !important; height: 100% !important; 
            z-index: 1 !important; 
            overflow: hidden !important;
        }
        
        /* Forza il canvas di Unity a rimanere dentro i bordi */
        #gameContainer canvas { 
            width: 100% !important; 
            height: 100% !important; 
            position: absolute !important; 
            top: 0 !important; left: 0 !important;
            object-fit: contain !important;
            outline: none; 
        }

        /* UI LAYER - Sopra tutto, non blocca i click del gioco */
        .ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 999999 !important; 
            pointer-events: none; 
            padding: 24px; box-sizing: border-box; 
            display: flex; flex-direction: column; justify-content: space-between; 
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }

        /* EFFETTO VETRO (Solo sui pannelli, non sulla finestra) */
        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 12px 24px;
            color: white;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo { font-weight: 800; font-size: 24px; letter-spacing: -1px; text-transform: lowercase; }
        .logo span { color: var(--accent); }

        .timer-panel { flex-direction: column; align-items: center; gap: 4px; padding: 8px 24px; }
        .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #a1a1aa; }
        .timer-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }

        /* Bottone Fullscreen */
        .btn-fullscreen {
            background: transparent; border: none; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 8px; border-radius: 8px; transition: background 0.2s;
            pointer-events: auto;
        }
        .btn-fullscreen:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-fullscreen svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
    
    <script type="text/javascript" src="4399.js"></script>
    <script>
        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers',
            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build/SanFrancisco.json',
            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693
            }
        };
    </script>
</head>
<body>

    <!-- La cornice di vetro (Ora nera dentro) -->
    <div class="glass-window" id="glassWindow">
        
        <!-- Il gioco -->
        <div id="gameContainer" tabindex="0"></div>

        <!-- La nostra UI in vetro -->
        <div class="ui-layer">
            <div class="top-bar">
                <div class="glass-panel logo">krokz<span>no coin</span></div>
                
                <div style="display: flex; gap: 12px; align-items: flex-start;">
                    <div class="glass-panel timer-panel">
                        <div class="timer-label">No Coin Timer</div>
                        <div class="timer-value" id="timerDisplay">00:00.00</div>
                    </div>
                    <!-- Pulsante Fullscreen -->
                    <button class="glass-panel btn-fullscreen" id="fullscreenBtn" title="Toggle Fullscreen">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        const glassWindow = document.getElementById('glassWindow');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        fullscreenBtn.addEventListener('click', () => {
            glassWindow.classList.toggle('fullscreen');
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 450);
        });

        setTimeout(() => {
            const canvas = document.querySelector('#gameContainer canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
                canvas.addEventListener('mousedown', () => canvas.focus());
            }
        }, 3000);
    </script>
</body>
</html>
