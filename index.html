<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b;
            --dot-color: #8b5cf6; /* Viola */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        /* Reset totale e sfondo base */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color) !important; 
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* SFONDO A PALLINI VIOLA - Z-INDEX NEGATIVO ESTREMO */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            z-index: -9999 !important; /* Dietro a tutto */
            pointer-events: none;
        }

        /* DISTRUGGIAMO GLI SFONDI DI UNITY */
        /* Questa regola dice: qualsiasi div creato da Unity al di fuori della finestra è trasparente */
        body > div:not(.window-container):not(.bg-grid) {
            background: transparent !important;
            background-color: transparent !important;
        }

        /* FINESTRA AL CENTRO */
        .window-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; height: 85vh;
            max-width: 1400px; max-height: 850px;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transition: all 0.3s ease-in-out;
            z-index: 10;
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh;
            max-width: 100%; max-height: 100%;
            border-radius: 0; border: none;
        }

        /* CONTENITORE DEL GIOCO */
        #gameContainer {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 1 !important;
        }

        /* FORZA IL CANVAS A RIEMPIRE TUTTO */
        /* Usiamo selettori potentissimi per sovrascrivere gli stili inline di Unity */
        #gameContainer canvas, 
        #unity-canvas,
        canvas {
            position: absolute !important;
            top: 0 !important; 
            left: 0 !important;
            width: 100% !important; 
            height: 100% !important;
            object-fit: contain !important;
            outline: none !important;
            display: block !important;
            z-index: 1 !important;
        }

        /* UI OVERLAY */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 20px;
            color: var(--text-color);
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: lowercase;
            display: flex;
            gap: 6px;
        }
        
        .logo .highlight { color: var(--dot-color); }

        .btn-fullscreen {
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: white;
        }

        .btn-fullscreen:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-fullscreen svg { width: 20px; height: 20px; fill: currentColor; }
    </style>

    <script type="text/javascript" src="4399.js"></script>
    <script>
        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers',
            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build/SanFrancisco.json',
            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693
            }
        };
    </script>
</head>
<body>

    <!-- Sfondo a pallini viola (Incastrato nel fondo) -->
    <div class="bg-grid"></div>

    <!-- La finestra con il gioco -->
    <div class="window-container" id="windowContainer">
        <div id="gameContainer" tabindex="0"></div>

        <div class="ui-overlay">
            <div class="glass-panel logo">
                krokz <span class="highlight">no coin</span>
            </div>
            <button class="btn-fullscreen glass-panel" id="fullscreenBtn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 350);
        });

        // IL BUTTAFUORI: Prende il Canvas e lo sbatte dentro #gameContainer
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.tagName === 'CANVAS') {
                        if (!gameContainer.contains(node)) {
                            gameContainer.appendChild(node);
                            
                            // Forza il canvas a riempire la finestra rimuovendo gli stili inline di Unity
                            node.style.setProperty('width', '100%', 'important');
                            node.style.setProperty('height', '100%', 'important');
                            node.style.setProperty('position', 'absolute', 'important');
                            node.style.setProperty('top', '0', 'important');
                            node.style.setProperty('left', '0', 'important');

                            // Focus per far funzionare input
                            setTimeout(() => {
                                node.setAttribute('tabindex', '0');
                                node.focus();
                                node.onmousedown = () => node.focus();
                            }, 100);
                        }
                    }
                });
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Rimuoviamo forzatamente eventuali div blu di sfondo generati da Unity
        setInterval(() => {
            const unityWrapper = document.getElementById('unity-container');
            if (unityWrapper && unityWrapper.parentElement === document.body) {
                unityWrapper.style.setProperty('background', 'transparent', 'important');
                unityWrapper.style.setProperty('background-color', 'transparent', 'important');
            }
        }, 500);
    </script>
</body>
</html>
