<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b; 
            --dot-color: #8b5cf6; 
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: transparent; font-family: 'Inter', sans-serif; user-select: none;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px; z-index: 1; pointer-events: none;
        }

        .window-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 85vh; max-width: 1400px; max-height: 850px;
            background: #000; border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8); overflow: hidden;
            transition: all 0.3s ease-in-out; z-index: 10; 
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; border-radius: 0; border: none;
        }

        #gameContainer {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; z-index: 1 !important; overflow: hidden !important;
        }
        #gameContainer canvas, #game-container { 
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; object-fit: contain !important;
            outline: none !important; display: block !important; margin: 0 !important; padding: 0 !important; z-index: 1 !important;
        }

        /* SCHERMATA DI CARICAMENTO */
        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease; color: white;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--dot-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #a1a1aa; animation: pulse 1.5s infinite alternate; }
        .loading-title { font-size: 32px; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .loading-title span { color: var(--dot-color); }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* OVERLAY COUNTDOWN */
        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 150;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #countdownOverlay.active { opacity: 1; pointer-events: auto; }
        .countdown-number {
            font-size: 120px; font-weight: 800; color: white;
            text-shadow: 0 0 20px var(--dot-color);
            animation: pop 1s ease-out infinite;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* UI OVERLAY */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; padding: 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 20px;
            color: var(--text-color); pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-transform: lowercase; display: flex; gap: 6px; }
        .logo .highlight { color: var(--dot-color); }

        .top-right-buttons { display: flex; gap: 12px; align-items: flex-start;}
        
        .btn-icon {
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: white;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }

        /* TIMER WIDGET */
        #timerWidget {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 24px; color: white; cursor: grab;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: border-color 0.3s, color 0.3s;
            pointer-events: auto;
        }
        #timerWidget.invalid { border-color: #ef4444; color: #ef4444; }
        #timerWidget.paused { border-color: #eab308; color: #eab308; }
        .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #a1a1aa; margin-bottom: 4px; }
        #timerDisplay { font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }

        /* SETTINGS MODAL */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 90%; max-width: 450px; padding: 30px; border-radius: 24px;
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: white; font-weight: 600; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dot-color); }
        input:checked + .slider:before { transform: translateX(22px); }
        .btn-close { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px; }
    </style>

    <script>
        // HACK 999k: Scrive di nascosto i soldi nel salvataggio
        setInterval(() => {
            try {
                const req = indexedDB.open('/idbfs');
                req.onsuccess = function() {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('FILE_DATA')) return;
                    const tx = db.transaction('FILE_DATA', 'readwrite');
                    tx.objectStore('FILE_DATA').openCursor().onsuccess = function(e) {
                        const cursor = e.target.result;
                        if (cursor) {
                            if (typeof cursor.key === 'string' && cursor.key.includes('player')) {
                                let content = new TextDecoder().decode(cursor.value.contents);
                                content = content.replace(/"coins":\s*\d+/g, '"coins": 999999').replace(/"keys":\s*\d+/g, '"keys": 999999');
                                cursor.value.contents = new TextEncoder().encode(content);
                                cursor.update(cursor.value);
                            }
                            cursor.continue();
                        }
                    };
                };
            } catch(e) {}
        }, 3000);
    </script>
</head>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        // UI e Base
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const timerWidget = document.getElementById('timerWidget');
        const timerDisplay = document.getElementById('timerDisplay');
        const loadingScreen = document.getElementById('loadingScreen');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const settingsModal = document.getElementById('settingsModal');
        let autoRestartEnabled = true;

        document.getElementById('settingsBtn').onclick = () => settingsModal.classList.add('active');
        document.getElementById('closeSettings').onclick = () => settingsModal.classList.remove('active');
        document.getElementById('autoRestartToggle').onchange = (e) => autoRestartEnabled = e.target.checked;
        document.getElementById('fullscreenBtn').onclick = () => { windowContainer.classList.toggle('fullscreen'); window.dispatchEvent(new Event('resize')); };

        // Drag Timer
        let isDragging = false, offsetX, offsetY;
        timerWidget.onmousedown = (e) => { isDragging = true; const r = timerWidget.getBoundingClientRect(); offsetX = e.clientX - r.left; offsetY = e.clientY - r.top; timerWidget.style.transform = 'none'; timerWidget.style.left = r.left + 'px'; timerWidget.style.top = r.top + 'px'; };
        document.onmousemove = (e) => { if (isDragging) { timerWidget.style.left = (e.clientX - offsetX) + 'px'; timerWidget.style.top = (e.clientY - offsetY) + 'px'; } };
        document.onmouseup = () => isDragging = false;

        // Gestione Caricamento visivo
        const checkLoad = setInterval(() => {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                loadingScreen.classList.add('hidden');
                clearInterval(checkLoad);
            }
        }, 500);

        // --- SISTEMA TIMER ---
        let timerState = 'idle'; 
        let startTime = 0;
        let elapsedTime = 0;
        let timerRaf;
        let firstRun = true;

        function updateTimer() {
            if (timerState !== 'running') return;
            elapsedTime = performance.now() - startTime;
            const m = String(Math.floor(elapsedTime / 60000)).padStart(2, '0');
            const s = String(Math.floor((elapsedTime % 60000) / 1000)).padStart(2, '0');
            const ms = String(Math.floor(elapsedTime % 1000)).padStart(3, '0');
            timerDisplay.innerText = `${m}:${s}:${ms}`;
            timerRaf = requestAnimationFrame(updateTimer);
        }

        // --- COLLEGAMENTO REALE AI TASTI DEL GIOCO (POKI SDK) ---
        let hooked = false;
        setInterval(() => {
            if (window.PokiSDK && !hooked) {
                const origStop = window.PokiSDK.gameplayStop;
                const origStart = window.PokiSDK.gameplayStart;
                
                // Si attiva quando clicchi la rotellina impostazioni del gioco
                window.PokiSDK.gameplayStop = function() {
                    if (timerState === 'running') {
                        timerState = 'paused';
                        cancelAnimationFrame(timerRaf);
                        timerWidget.classList.add('paused');
                    }
                    if (origStop) return origStop.apply(this, arguments);
                };
                
                // Si attiva quando clicchi Play o Resume del gioco
                window.PokiSDK.gameplayStart = function() {
                    if (firstRun || timerState === 'idle') {
                        // Partenza da zero
                        firstRun = false;
                        timerState = 'running';
                        elapsedTime = 0;
                        startTime = performance.now();
                        timerWidget.classList.remove('invalid', 'paused');
                        timerRaf = requestAnimationFrame(updateTimer);
                    } 
                    else if (timerState === 'paused') {
                        // Ripresa dalla pausa con countdown
                        countdownOverlay.classList.add('active');
                        let count = 3;
                        countdownText.innerText = count;
                        const cInt = setInterval(() => {
                            count--;
                            if (count > 0) countdownText.innerText = count;
                            else if (count === 0) countdownText.innerText = "GO!";
                            else {
                                clearInterval(cInt);
                                countdownOverlay.classList.remove('active');
                                timerState = 'running';
                                timerWidget.classList.remove('paused');
                                startTime = performance.now() - elapsedTime;
                                timerRaf = requestAnimationFrame(updateTimer);
                            }
                        }, 1000);
                    }
                    if (origStart) return origStart.apply(this, arguments);
                };
                hooked = true;
            }
        }, 500);

        // --- SCONFITTA (PREMI "C" PER FAR FERMARE IL TIMER ALLA MONETA) ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyC' && timerState === 'running') {
                timerState = 'invalid';
                cancelAnimationFrame(timerRaf);
                timerWidget.classList.add('invalid');
                
                if (autoRestartEnabled) {
                    setTimeout(() => window.location.reload(), 2000);
                }
            }
        });
    </script>
