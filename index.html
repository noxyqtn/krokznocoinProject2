<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b; 
            --dot-color: #8b5cf6; 
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: transparent; font-family: 'Inter', sans-serif; user-select: none;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px; z-index: 1; pointer-events: none;
        }

        .window-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 85vh; max-width: 1400px; max-height: 850px;
            background: #000; border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8); overflow: hidden;
            transition: all 0.3s ease-in-out; z-index: 10; 
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; border-radius: 0; border: none;
        }

        #gameContainer {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; z-index: 1 !important; overflow: hidden !important;
        }
        #gameContainer canvas, #game-container { 
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; object-fit: contain !important;
            outline: none !important; display: block !important; margin: 0 !important; padding: 0 !important; z-index: 1 !important;
        }

        /* SCHERMATA DI CARICAMENTO */
        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease; color: white;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--dot-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #a1a1aa; animation: pulse 1.5s infinite alternate; }
        .loading-title { font-size: 32px; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .loading-title span { color: var(--dot-color); }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* OVERLAY COUNTDOWN 3 SECONDI */
        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 150;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #countdownOverlay.active { opacity: 1; pointer-events: auto; }
        .countdown-number {
            font-size: 120px; font-weight: 800; color: white;
            text-shadow: 0 0 20px var(--dot-color);
            animation: pop 1s ease-out infinite;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* UI OVERLAY */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; padding: 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 20px;
            color: var(--text-color); pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-transform: lowercase; display: flex; gap: 6px; }
        .logo .highlight { color: var(--dot-color); }

        .top-right-buttons { display: flex; gap: 12px; align-items: flex-start;}
        
        .btn-icon {
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: white;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }

        /* FPS COUNTER */
        #fpsCounter {
            position: absolute; bottom: 24px; right: 24px; z-index: 100;
            font-family: 'Courier New', Courier, monospace; font-size: 14px;
            color: #00ffcc; text-shadow: 0 0 5px #00ffcc; pointer-events: none;
        }

        /* TIMER WIDGET */
        #timerWidget {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 24px; color: white; cursor: grab;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: border-color 0.3s, color 0.3s, transform 0.1s;
            pointer-events: auto;
        }
        #timerWidget:active { cursor: grabbing; }
        #timerWidget.invalid { border-color: #ef4444; color: #ef4444; }
        #timerWidget.paused { border-color: #eab308; color: #eab308; }

        .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #a1a1aa; margin-bottom: 4px; }
        #timerDisplay { font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; transition: font-size 0.2s; }
        
        .timer-controls { display: flex; gap: 8px; margin-top: 8px; }
        .timer-btn { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 6px; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .timer-btn:hover { background: rgba(255,255,255,0.2); }

        /* SETTINGS MODAL */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            width: 90%; max-width: 450px; padding: 30px; border-radius: 24px;
            transform: translateY(20px); transition: transform 0.3s;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; color: white; font-weight: 600; font-size: 14px;
        }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dot-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Keybind Buttons */
        .keybind-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 6px 16px; border-radius: 8px; font-weight: 800; font-family: 'Courier New', Courier, monospace;
            cursor: pointer; transition: all 0.2s; min-width: 60px; text-align: center;
        }
        .keybind-btn:hover { background: rgba(255,255,255,0.2); }
        .keybind-btn.listening { background: var(--dot-color); color: white; border-color: white; animation: pulse 1s infinite alternate; }

        .btn-close { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .btn-close:hover { background: #e4e4e7; }
    </style>

    <!-- INTERCETTA AUDIO CONTEXT PER RILEVARE LA PAUSA -->
    <script>
        (function() {
            const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
            if (!OriginalAudioContext) return;
            window.AudioContext = function() {
                const context = new OriginalAudioContext();
                const originalSuspend = context.suspend;
                const originalResume = context.resume;
                context.suspend = function() {
                    if (window.onGamePaused) window.onGamePaused();
                    return originalSuspend.apply(context, arguments);
                };
                context.resume = function() {
                    if (window.onGameResumed) window.onGameResumed();
                    return originalResume.apply(context, arguments);
                };
                return context;
            };
            window.webkitAudioContext = window.AudioContext;
        })();
    </script>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const loadingScreen = document.getElementById('loadingScreen');
        const timerWidget = document.getElementById('timerWidget');
        const timerDisplay = document.getElementById('timerDisplay');
        const autoRestartToggle = document.getElementById('autoRestartToggle');
        const customKeysToggle = document.getElementById('customKeysToggle');
        const keybindContainer = document.getElementById('keybind-container');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const fpsCounter = document.getElementById('fpsCounter');

        // --- 1. SETTINGS E KEYBINDS STATE ---
        let autoRestartEnabled = false;
        let customKeysEnabled = true;
        
        // Configurazione Default dei tasti (usiamo e.code)
        let keybinds = {
            up: 'KeyW',
            down: 'KeyS',
            left: 'KeyA',
            right: 'KeyD'
        };

        // UI per i keybinds
        const bindBtns = {
            up: document.getElementById('bind-up'),
            down: document.getElementById('bind-down'),
            left: document.getElementById('bind-left'),
            right: document.getElementById('bind-right')
        };

        // Funzione per formattare il codice del tasto in modo carino
        function formatKeyName(code) {
            if (code.startsWith('Key')) return code.replace('Key', '');
            if (code.startsWith('Arrow')) return code.replace('Arrow', '');
            if (code.startsWith('Digit')) return code.replace('Digit', '');
            if (code === 'Space') return 'SPACE';
            return code;
        }

        // Inizializza UI
        for (let action in keybinds) {
            bindBtns[action].innerText = formatKeyName(keybinds[action]);
        }

        let listeningAction = null; // Traccia quale tasto stiamo aspettando

        // Click sui bottoni per ascoltare il nuovo tasto
        for (let action in bindBtns) {
            bindBtns[action].addEventListener('click', (e) => {
                if (listeningAction) return; // Ignora se stiamo già ascoltando
                e.stopPropagation();
                
                listeningAction = action;
                bindBtns[action].classList.add('listening');
                bindBtns[action].innerText = 'Press...';
            });
        }

        // Funzione per aggiornare il Keybind
        function assignKey(e) {
            if (!listeningAction) return;
            e.preventDefault();
            e.stopPropagation();

            keybinds[listeningAction] = e.code;
            bindBtns[listeningAction].classList.remove('listening');
            bindBtns[listeningAction].innerText = formatKeyName(e.code);
            
            listeningAction = null;
        }

        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('active');
            listeningAction = null; // Reset se chiude mentre ascolta
            for (let action in bindBtns) bindBtns[action].classList.remove('listening');
        });
        
        autoRestartToggle.addEventListener('change', (e) => autoRestartEnabled = e.target.checked);
        
        customKeysToggle.addEventListener('change', (e) => {
            customKeysEnabled = e.target.checked;
            keybindContainer.style.opacity = customKeysEnabled ? '1' : '0.4';
            keybindContainer.style.pointerEvents = customKeysEnabled ? 'auto' : 'none';
        });

        // --- 2. FULLSCREEN & CARICAMENTO ---
        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 350);
        });

        let attempts = 0;
        const gameCheckInterval = setInterval(() => {
            attempts++;
            const canvas = document.querySelector('canvas');
            if (canvas) {
                if (!canvas.hasAttribute('data-focus-init')) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.setAttribute('data-focus-init', 'true');
                    canvas.focus();
                    canvas.addEventListener('mousedown', () => canvas.focus());
                }
                if (attempts > 5 && !loadingScreen.classList.contains('hidden')) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => { if(loadingScreen) loadingScreen.remove(); }, 600);
                }
            }
            const unityWrapper = document.getElementById('game-container');
            if (unityWrapper && unityWrapper.parentElement !== gameContainer) {
                gameContainer.appendChild(unityWrapper);
            }
            if (attempts > 30) clearInterval(gameCheckInterval);
        }, 500);

        // --- 3. FPS COUNTER ---
        let lastFrameTime = performance.now();
        let frames = 0;
        function updateFPS() {
            frames++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                fpsCounter.innerText = `FPS: ${frames}`;
                frames = 0;
                lastFrameTime = now;
            }
            requestAnimationFrame(updateFPS);
        }
        requestAnimationFrame(updateFPS);

        // --- 4. TIMER LOGIC & COUNTDOWN ---
        let timerState = 'idle';
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let countdownInterval;

        function formatTime(ms) {
            const minutes = String(Math.floor(ms / 60000)).padStart(2, '0');
            const seconds = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const milliseconds = String(Math.floor(ms % 1000)).padStart(3, '0');
            return `${minutes}:${seconds}:${milliseconds}`;
        }

        function updateTimer() {
            if (timerState !== 'running') return;
            elapsedTime = performance.now() - startTime;
            timerDisplay.innerText = formatTime(elapsedTime);
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function startTimer() {
            if (timerState === 'running') return;
            timerState = 'running';
            timerWidget.classList.remove('invalid', 'paused');
            startTime = performance.now() - elapsedTime;
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function pauseTimer() {
            if (timerState !== 'running') return;
            timerState = 'paused';
            cancelAnimationFrame(timerInterval);
            timerWidget.classList.add('paused');
        }

        function startCountdownThenResume() {
            if (timerState !== 'paused') return;
            timerState = 'countdown';
            countdownOverlay.classList.add('active');
            let count = 3;
            countdownText.innerText = count;

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                } else if (count === 0) {
                    countdownText.innerText = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    countdownOverlay.classList.remove('active');
                    startTimer();
                }
            }, 1000);
        }

        function resetTimer() {
            timerState = 'idle';
            elapsedTime = 0;
            cancelAnimationFrame(timerInterval);
            clearInterval(countdownInterval);
            countdownOverlay.classList.remove('active');
            timerDisplay.innerText = "00:00:000";
            timerWidget.classList.remove('invalid', 'paused');
        }

        function stopTimerWithPenalty() {
            timerState = 'invalid';
            cancelAnimationFrame(timerInterval);
            timerWidget.classList.add('invalid');
            timerWidget.classList.remove('paused');
        }

        // --- 5. INPUT MAPPING E KEYDOWN ---
        window.addEventListener('keydown', (e) => {
            // 1. Se stiamo assegnando un tasto, intercettalo e fermati
            if (listeningAction) {
                assignKey(e);
                return;
            }

            // 2. Gestione Pausa (ESC o P)
            if (e.code === 'Escape' || e.code === 'KeyP') {
                if (timerState === 'running') pauseTimer();
            }
            
            // 3. Gestione Avvio/Ripresa con INVIO (Enter)
            if (e.code === 'Enter') {
                if (timerState === 'idle') {
                    resetTimer();
                    startTimer();
                } else if (timerState === 'paused') {
                    startCountdownThenResume();
                }
            }

            // NON intercettiamo WASD/Frecce/Spazio: lasciamo che Unity li gestisca nativamente.
            // Se l'utente vuole usare tasti personalizzati, dobbiamo comunque evitare conflitti.
            // Per ora, se customKeysEnabled è true, non facciamo nulla e lasciamo passare.
            // In futuro potremmo implementare la simulazione solo per tasti non nativi.
        });

        // --- 6. EVENTI DI GIOCO (HOOKS) ---
        window.onGameStarted = function() { resetTimer(); startTimer(); };
        window.onGamePaused = function() { pauseTimer(); };
        window.onGameResumed = function() { if (timerState === 'paused') startCountdownThenResume(); };
        
        window.onCoinCollected = function() {
            if (timerState === 'running') {
                stopTimerWithPenalty();
                if (autoRestartEnabled) {
                    setTimeout(() => {
                        resetTimer();
                        if (window.unityGame && window.unityGame.SendMessage) {
                            window.unityGame.SendMessage("GameManager", "RestartGame");
                        } else {
                            window.location.reload();
                        }
                    }, 2000);
                }
            }
        };
    </script>
</body>
