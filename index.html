<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krokz No Coin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&family=Helvetica+Neue:wght@400;500;600;700&display=swap');

        /* Glassmorphic Dark Design System Tokens */
        :root {
            --background: oklch(0.14 0 0);
            --foreground: oklch(1 0 0);
            --card: oklch(1 0 0 / 0.06);
            --card-foreground: oklch(0.98 0 0);
            --popover: oklch(0.18 0 0 / 0.92);
            --popover-foreground: oklch(1 0 0);
            --primary: oklch(0.65 0.19 250);
            --primary-foreground: oklch(1 0 0);
            --secondary: oklch(1 0 0 / 0.08);
            --secondary-foreground: oklch(0.7 0 0);
            --muted: oklch(1 0 0 / 0.05);
            --muted-foreground: oklch(0.55 0 0);
            --accent: oklch(0.65 0.19 250 / 0.15);
            --accent-foreground: oklch(0.98 0 0);
            --destructive: oklch(0.58 0.22 27);
            --destructive-foreground: oklch(1 0 0);
            --border: oklch(1 0 0 / 0.12);
            --input: oklch(1 0 0 / 0.06);
            --ring: oklch(0.65 0.19 250);
            --radius: 1.25rem;
            --chart-1: var(--primary);
            --chart-2: oklch(from var(--primary) calc(l - 0.09) calc(c * 0.92) h);
            --chart-3: oklch(from var(--primary) calc(l - 0.18) calc(c * 0.84) h);
            --chart-4: oklch(from var(--primary) calc(l - 0.27) calc(c * 0.76) h);
            --chart-5: oklch(from var(--primary) calc(l - 0.36) calc(c * 0.68) h);
            --transition-duration-fast: 180ms;
            --transition-duration-base: 240ms;
            --transition-duration-slow: 300ms;
            --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-in: cubic-bezier(0.895, 0.03, 0.685, 0.22);
            --default-transition-duration: var(--transition-duration-fast);
            --default-transition-timing-function: var(--ease-out);
            --ai-label: var(--muted);
            --ai-label-foreground: var(--foreground);
            --layout-density: comfortable;
            --layout-density-source: design-system;
            --layout-sidebar: calc(var(--spacing, 0.25rem) * 56);
            --layout-inset: calc(var(--spacing, 0.25rem) * 6);
            --layout-section-gap: calc(var(--spacing, 0.25rem) * 8);
            --layout-column-gap: calc(var(--spacing, 0.25rem) * 4);
            --layout-card-padding: calc(var(--spacing, 0.25rem) * 5);
            --font-sans: var(--font-geist-sans), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --radius-sm: calc(var(--radius) - 0.25rem);
            --radius-md: calc(var(--radius) - 0.125rem);
            --radius-lg: var(--radius);
            --radius-xl: calc(var(--radius) + 0.25rem);
            --radius-2xl: 1rem;
        }

        .dark {
            --background: oklch(0.14 0 0);
            --foreground: oklch(1 0 0);
            --card: oklch(1 0 0 / 0.06);
            --card-foreground: oklch(0.98 0 0);
            --popover: oklch(0.18 0 0 / 0.92);
            --popover-foreground: oklch(1 0 0);
            --primary: oklch(0.65 0.19 250);
            --primary-foreground: oklch(1 0 0);
            --secondary: oklch(1 0 0 / 0.08);
            --secondary-foreground: oklch(0.7 0 0);
            --muted: oklch(1 0 0 / 0.05);
            --muted-foreground: oklch(0.55 0 0);
            --accent: oklch(0.65 0.19 250 / 0.15);
            --accent-foreground: oklch(0.98 0 0);
            --destructive: oklch(0.58 0.22 27);
            --destructive-foreground: oklch(1 0 0);
            --border: oklch(1 0 0 / 0.12);
            --input: oklch(1 0 0 / 0.06);
            --ring: oklch(0.65 0.19 250);
            --radius: 1.25rem;
            --chart-1: var(--primary);
            --chart-2: oklch(from var(--primary) calc(l - 0.09) calc(c * 0.92) h);
            --chart-3: oklch(from var(--primary) calc(l - 0.18) calc(c * 0.84) h);
            --chart-4: oklch(from var(--primary) calc(l - 0.27) calc(c * 0.76) h);
            --chart-5: oklch(from var(--primary) calc(l - 0.36) calc(c * 0.68) h);
            --transition-duration-fast: 180ms;
            --transition-duration-base: 240ms;
            --transition-duration-slow: 300ms;
            --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-in: cubic-bezier(0.895, 0.03, 0.685, 0.22);
            --default-transition-duration: var(--transition-duration-fast);
            --default-transition-timing-function: var(--ease-out);
            --ai-label: var(--muted);
            --ai-label-foreground: var(--foreground);
            --layout-density: comfortable;
            --layout-density-source: design-system;
            --layout-sidebar: calc(var(--spacing, 0.25rem) * 56);
            --layout-inset: calc(var(--spacing, 0.25rem) * 6);
            --layout-section-gap: calc(var(--spacing, 0.25rem) * 8);
            --layout-column-gap: calc(var(--spacing, 0.25rem) * 4);
            --layout-card-padding: calc(var(--spacing, 0.25rem) * 5);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--background);
            font-family: var(--font-sans);
            color: var(--foreground);
            user-select: none;
        }

        /* Host isolation CSS */
        .ds {
            color: var(--foreground);
            background: var(--background);
        }
        .ds :where(h1,h2,h3,h4,h5,h6,p,strong,label,legend,li,dt,dd,small):not(.ds-supporting):not(.ds-card-desc):not(.ds-muted) {
            color: inherit !important;
        }

        /* Liquid Glass Game Window - Centered Container */
        .game-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 85vh;
            max-width: 1200px;
            max-height: 800px;
            min-width: 320px;
            min-height: 400px;
            border-radius: var(--radius-2xl);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow:
                0 0.25rem 1.5rem rgba(0,0,0,0.3),
                inset 0 0 0.5rem rgba(255,255,255,0.06);
            backdrop-filter: blur(80px) saturate(150%);
            -webkit-backdrop-filter: blur(80px) saturate(150%);
            z-index: 10;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition:
                width var(--transition-duration-base) var(--ease-out),
                height var(--transition-duration-base) var(--ease-out),
                max-width var(--transition-duration-base) var(--ease-out),
                max-height var(--transition-duration-base) var(--ease-out),
                border-radius var(--transition-duration-base) var(--ease-out),
                top var(--transition-duration-base) var(--ease-out),
                left var(--transition-duration-base) var(--ease-out),
                transform var(--transition-duration-base) var(--ease-out);
        }

        /* Fullscreen state */
        .game-window.is-fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            min-width: 0;
            min-height: 0;
            top: 0;
            left: 0;
            transform: none;
            border-radius: 0;
        }

        /* Unity Canvas Container - INSIDE the window, clipped */
        #gameContainer {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden; /* Clips canvas if it exceeds bounds */
            z-index: 1;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            display: block;
        }

        /* UI Layer - Overlay on top of game, non-intercepting clicks */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* CRITICAL: doesn't intercept clicks */
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Glass Panel Component - using design system token values */
        .glass-panel {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid color-mix(in oklab, oklch(1 0 0) 10%, transparent);
            border-radius: 9999px; /* pill shape per design system */
            box-shadow: inset 0 0 0.375rem rgba(255,255,255,0.06);
            padding: 8px 16px; /* on-scale: 8, 16 */
            color: var(--card-foreground);
            pointer-events: auto; /* Only this panel catches clicks */
            display: inline-flex;
            align-items: center;
            gap: 8px; /* on-scale: 8 */
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.25rem;
            white-space: nowrap;
            transition:
                background-color var(--transition-duration-base) var(--ease-out),
                border-color var(--transition-duration-base) var(--ease-out),
                box-shadow var(--transition-duration-base) var(--ease-out);
            min-height: 44px; /* ensure minimum touch target for interactive element */
        }

        .glass-panel:hover {
            background-color: oklch(1 0 0);
            border-color: oklch(1 0 0);
            color: var(--foreground);
        }

        .logo {
            font-weight: 700;
            font-size: 0.875rem;
            letter-spacing: -0.01em;
            text-transform: lowercase;
        }

        .logo span {
            color: var(--primary);
        }

        /* Fullscreen Toggle Button */
        .fullscreen-btn {
            background: var(--card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid color-mix(in oklab, oklch(1 0 0) 10%, transparent);
            border-radius: 9999px;
            box-shadow: inset 0 0 0.375rem rgba(255,255,255,0.06);
            padding: 12px 16px; /* on-scale: 12, 16; ensures 44x44 touch target (12+20+12=44) */
            color: var(--card-foreground);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* on-scale: 8 */
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.25rem;
            white-space: nowrap;
            transition:
                background-color var(--transition-duration-base) var(--ease-out),
                border-color var(--transition-duration-base) var(--ease-out),
                box-shadow var(--transition-duration-base) var(--ease-out),
                filter var(--transition-duration-fast) var(--ease-out);
            min-height: 44px; /* ensure minimum touch target */
            min-width: 44px;
        }

        .fullscreen-btn:hover {
            background-color: oklch(1 0 0);
            border-color: oklch(1 0 0);
            color: var(--foreground);
        }

        .fullscreen-btn:active {
            filter: brightness(90%);
            transform: scale(0.98);
        }

        .fullscreen-btn:focus-visible {
            outline: 2px solid transparent;
            outline-offset: 2px;
            box-shadow:
                inset 0 0 0.375rem rgba(255,255,255,0.06),
                0 0 0 0.1875rem oklch(0.65 0.19 250 / 0.2);
            border-color: color-mix(in oklab, var(--primary) 50%, transparent);
        }

        .fullscreen-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .game-window {
                width: 95vw;
                height: 90vh;
                max-width: 100vw;
                max-height: 100vh;
                min-width: 0;
                min-height: 0;
            }

            .ui-layer {
                padding: 8px 12px;
            }

            .glass-panel {
                padding: 8px 12px; /* on-scale: 8, 12 */
                font-size: 0.8125rem;
            }

            .fullscreen-btn {
                padding: 12px 16px; /* on-scale: 12, 16; ensures 44x44 touch target */
            }
        }

        @media (hover: hover) and (pointer: fine) {
            .glass-panel:focus-visible,
            .fullscreen-btn:focus-visible {
                outline: 2px solid transparent;
                outline-offset: 2px;
                box-shadow:
                    inset 0 0 0.375rem rgba(255,255,255,0.06),
                    0 0 0 0.1875rem oklch(0.65 0.19 250 / 0.2);
                border-color: color-mix(in oklab, var(--primary) 50%, transparent);
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .game-window {
                transition: none;
            }
            .glass-panel,
            .fullscreen-btn {
                transition: none;
            }
        }

        /* Scrollbar gutter stability */
        html {
            scrollbar-gutter: stable;
        }
    </style>

</head>
<body class="ds">
    <div class="game-window" id="gameWindow">
        <div id="gameContainer"></div>

        <div class="ui-layer">
            <div class="top-bar">
                <div class="glass-panel logo">krokz<span>no coin</span></div>
                <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" aria-pressed="false">
                    <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                    </svg>
                    <svg id="exitFullscreenIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                        <path d="M4 14h6M4 10h6M14 4v6M14 18v6M18 4h6M18 18h6M22 14h-6M22 10h-6M2 4v6M2 18v6"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="master-loader.js"></script>
    <script>
        // Fullscreen toggle logic
        (function() {
            const gameWindow = document.getElementById('gameWindow');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const fullscreenIcon = document.getElementById('fullscreenIcon');
            const exitFullscreenIcon = document.getElementById('exitFullscreenIcon');

            let isFullscreen = false;

            function toggleFullscreen() {
                isFullscreen = !isFullscreen;
                gameWindow.classList.toggle('is-fullscreen', isFullscreen);
                fullscreenBtn.setAttribute('aria-pressed', isFullscreen);
                fullscreenIcon.style.display = isFullscreen ? 'none' : 'block';
                exitFullscreenIcon.style.display = isFullscreen ? 'block' : 'none';
                fullscreenBtn.setAttribute('aria-label', isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen');
            }

            fullscreenBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleFullscreen();
            });

            // ESC key to exit fullscreen
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isFullscreen) {
                    toggleFullscreen();
                }
            });

            // Double-click on game area to toggle fullscreen (optional UX)
            const gameContainer = document.getElementById('gameContainer');
            gameContainer.addEventListener('dblclick', function(e) {
                // Only toggle if clicking on empty space, not UI
                if (e.target === gameContainer || e.target.tagName === 'CANVAS') {
                    toggleFullscreen();
                }
            });
        })();
    </script>
</body>
