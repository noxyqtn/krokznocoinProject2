<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #121214;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        /* Sfondo grigio scuro con un leggero alone centrale */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e1e24 0%, #121214 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* La finestra principale che contiene TUTTO */
        .window-container {
            position: relative;
            width: 90vw;
            height: 85vh;
            max-width: 1400px;
            max-height: 850px;
            background: #000;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden; /* Taglia tutto quello che esce (Unity) */
            transition: all 0.3s ease-in-out;
            z-index: 10;
        }

        /* Stato Fullscreen */
        .window-container.fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        /* Il contenitore di Unity */
        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        /* Forza il canvas di Unity a stare nei limiti */
        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            outline: none;
        }

        /* L'interfaccia sopra il gioco (Logo e Bottone) */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Fa passare i click al gioco */
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Effetto Liquid Glass per i pannelli UI */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 20px;
            color: var(--text-color);
            pointer-events: auto; /* Riattiva i click sui pannelli */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: lowercase;
            display: flex;
            gap: 6px;
        }
        
        .logo .highlight { color: #a78bfa; } /* Colore viola per 'no coin' */

        /* Bottone Fullscreen */
        .btn-fullscreen {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 12px;
            transition: background 0.2s;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: white;
        }

        .btn-fullscreen:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-fullscreen svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>

    <!-- Configurazione Unity (Intatta) -->
    <script type="text/javascript" src="4399.js"></script>
    <script>
        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers',
            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build/SanFrancisco.json',
            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693
            }
        };
    </script>
</head>
<body>

    <!-- La Finestra che contiene il gioco -->
    <div class="window-container" id="windowContainer">
        
        <!-- Qui dentro Unity inietterà il gioco -->
        <div id="gameContainer" tabindex="0"></div>

        <!-- Interfaccia Utente -->
        <div class="ui-overlay">
            
            <!-- Logo in alto a sinistra -->
            <div class="glass-panel logo">
                krokz <span class="highlight">no coin</span>
            </div>

            <!-- Tasto Fullscreen in alto a destra -->
            <button class="btn-fullscreen glass-panel" id="fullscreenBtn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>

        </div>
    </div>

    <!-- Loader di Unity (Intatto) -->
    <script type="text/javascript" src="master-loader.js"></script>

    <!-- Script di supporto per UI e Focus -->
    <script>
        const windowContainer = document.getElementById('windowContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Gestione Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            
            // Forza Unity a ridimensionarsi dopo che l'animazione CSS è finita
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 350);
        });

        // Fix per far funzionare mouse e tastiera (Focus sul gioco)
        // Aspetta 3 secondi per far caricare il canvas di Unity
        setTimeout(() => {
            const canvas = document.querySelector('#gameContainer canvas');
            if (canvas) {
                canvas.setAttribute('tabindex', '0');
                canvas.focus();
                
                // Ripristina il focus ogni volta che l'utente clicca sul gioco
                canvas.addEventListener('mousedown', () => {
                    canvas.focus();
                });
            }
        }, 3000);
    </script>
</body>
</html>
