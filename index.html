<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b; 
            --dot-color: #8b5cf6; 
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: transparent; font-family: 'Inter', sans-serif; user-select: none;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px; z-index: 1; pointer-events: none;
        }

        .window-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 85vh; max-width: 1400px; max-height: 850px;
            background: #000; border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8); overflow: hidden;
            transition: all 0.3s ease-in-out; z-index: 10; 
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; border-radius: 0; border: none;
        }

        #gameContainer {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; z-index: 1 !important; overflow: hidden !important;
        }
        #gameContainer canvas, #game-container { 
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; object-fit: contain !important;
            outline: none !important; display: block !important; margin: 0 !important; padding: 0 !important; z-index: 1 !important;
        }

        /* SCHERMATA DI CARICAMENTO */
        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease; color: white;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--dot-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #a1a1aa; animation: pulse 1.5s infinite alternate; }
        .loading-title { font-size: 32px; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .loading-title span { color: var(--dot-color); }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* OVERLAY COUNTDOWN */
        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 150;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #countdownOverlay.active { opacity: 1; pointer-events: auto; }
        .countdown-number {
            font-size: 120px; font-weight: 800; color: white;
            text-shadow: 0 0 20px var(--dot-color);
            animation: pop 1s ease-out infinite;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* UI OVERLAY */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; padding: 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 20px;
            color: var(--text-color); pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-transform: lowercase; display: flex; gap: 6px; }
        .logo .highlight { color: var(--dot-color); }

        .top-right-buttons { display: flex; gap: 12px; align-items: flex-start;}
        
        .btn-icon {
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: white;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }

        /* FPS COUNTER */
        #fpsCounter {
            position: absolute; bottom: 24px; right: 24px; z-index: 100;
            font-family: 'Courier New', Courier, monospace; font-size: 14px;
            color: #00ffcc; text-shadow: 0 0 5px #00ffcc; pointer-events: none;
        }

        /* TIMER WIDGET */
        #timerWidget {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 24px; color: white; cursor: grab;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: border-color 0.3s, color 0.3s, transform 0.1s;
            pointer-events: auto;
        }
        #timerWidget:active { cursor: grabbing; }
        #timerWidget.invalid { border-color: #ef4444 !important; color: #ef4444 !important; }
        #timerWidget.paused { border-color: #eab308; color: #eab308; }

        .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #a1a1aa; margin-bottom: 4px; }
        #timerDisplay { font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }

        /* SETTINGS MODAL */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            width: 90%; max-width: 450px; padding: 30px; border-radius: 24px;
            transform: translateY(20px); transition: transform 0.3s;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: white; font-weight: 600; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dot-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-close { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px; }
    </style>

    <!-- 1. HOOK COMPLETO PRIMA DEL CARICAMENTO DI UNITY / POKI -->
    <script>
        window.activeUnityInstance = null;
        window.inGameCoins = 0;
        window.isGameRunning = false;
        window.isGamePaused = false;

        // Intercetta la creazione dell'istanza Unity
        const originalCreateUnityInstance = window.createUnityInstance;
        Object.defineProperty(window, 'UnityLoader', {
            configurable: true,
            set: function(val) {
                this._UnityLoader = val;
                if (val && val.instantiate) {
                    const originalInstantiate = val.instantiate;
                    val.instantiate = function(container, url, options) {
                        const originalOnProgress = options.onProgress;
                        const instance = originalInstantiate.call(this, container, url, options);
                        window.activeUnityInstance = instance;
                        setupUnityMemoryBridge();
                        return instance;
                    };
                }
            },
            get: function() { return this._UnityLoader; }
        });

        // INIEZIONE DI SALVATAGGIO 999K MONETE, CHIAVI E SBLOCCHI DIRETTAMENTE IN INDEXEDDB (Unity IDBFS)
        (function inject999kSave() {
            const req = indexedDB.open('/idbfs');
            req.onsuccess = function() {
                const db = req.result;
                if (db.objectStoreNames.contains('FILE_DATA')) {
                    const tx = db.transaction('FILE_DATA', 'readwrite');
                    const store = tx.objectStore('FILE_DATA');
                    const getAllReq = store.openCursor();
                    getAllReq.onsuccess = function(e) {
                        const cursor = e.target.result;
                        if (cursor) {
                            if (typeof cursor.key === 'string' && (cursor.key.includes('player') || cursor.key.includes('settings') || cursor.key.includes('prefs'))) {
                                try {
                                    let content = new TextDecoder().decode(cursor.value.contents);
                                    content = content.replace(/("coins":)\d+/g, '$1999999')
                                                     .replace(/("keys":)\d+/g, '$1999999')
                                                     .replace(/("characters":\[)([^\]]+)(\])/g, '$1"all"$3');
                                    cursor.value.contents = new TextEncoder().encode(content);
                                    cursor.update(cursor.value);
                                } catch(err) {}
                            }
                            cursor.continue();
                        }
                    };
                }
            };
        })();

        // Intercetta i log e le chiamate di PokiSDK / C# per intercettare i bottoni di gioco
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            const msg = args.join(' ');

            // Rileva quando premi Play nel gioco
            if (msg.includes('gameplayStart') || msg.includes('GameStarted') || msg.includes('StartGame')) {
                window.onSubwayPlay();
            }
            // Rileva quando premi la rotellina/impostazioni dentro Subway Surfers o ESC
            if (msg.includes('gameplayStop') || msg.includes('OpenPauseMenu') || msg.includes('GamePause')) {
                window.onSubwayPause();
            }
            // Rileva quando premi "Resume" dentro il menu di pausa di Subway
            if (msg.includes('gameplayResume') || msg.includes('ClosePauseMenu') || msg.includes('GameResume')) {
                window.onSubwayResume();
            }
        };

        // Bridge sulla memoria WASM per monitorare istante per istante le monete raccolte
        function setupUnityMemoryBridge() {
            setInterval(() => {
                if (!window.activeUnityInstance || !window.activeUnityInstance.Module) return;
                const mod = window.activeUnityInstance.Module;
                
                // Forziamo 999k monete/chiavi nella memoria di gioco se raggiungibile
                try {
                    if (mod.SendMessage) {
                        // Inietta personaggi e currency
                        mod.SendMessage("GameManager", "AddCoins", 999999);
                        mod.SendMessage("GameManager", "AddKeys", 999999);
                        mod.SendMessage("CharacterManager", "UnlockAllCharacters");
                    }
                } catch(e) {}

                // Rilevamento monete raccolte durante la corsa
                if (window.isGameRunning && !window.isGamePaused) {
                    try {
                        if (mod.HEAP32) {
                            // Se le monete salgono di 1, No-Coin Fallito!
                            const currentCoins = mod.HEAP32[mod._currentCoinOffset || 0];
                            if (currentCoins > 0) {
                                window.onCoinCollected();
                            }
                        }
                    } catch(e) {}
                }
            }, 100);
        }
    </script>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const loadingScreen = document.getElementById('loadingScreen');
        const timerWidget = document.getElementById('timerWidget');
        const timerDisplay = document.getElementById('timerDisplay');
        const autoRestartToggle = document.getElementById('autoRestartToggle');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');
        const fpsCounter = document.getElementById('fpsCounter');

        let autoRestartEnabled = true;
        autoRestartToggle.addEventListener('change', (e) => autoRestartEnabled = e.target.checked);

        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        closeSettings.addEventListener('click', () => settingsModal.classList.remove('active'));

        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 350);
        });

        // Nascondi schermata di caricamento
        let attempts = 0;
        const gameCheckInterval = setInterval(() => {
            attempts++;
            const canvas = document.querySelector('canvas');
            if (canvas) {
                if (attempts > 5 && !loadingScreen.classList.contains('hidden')) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => { if(loadingScreen) loadingScreen.remove(); }, 600);
                }
            }
            if (attempts > 30) clearInterval(gameCheckInterval);
        }, 500);

        // --- TIMER ENGINE ---
        let timerState = 'idle'; // 'idle', 'running', 'paused', 'failed'
        let startTime = 0;
        let elapsedTime = 0;
        let timerRaf = null;

        function formatTime(ms) {
            const minutes = String(Math.floor(ms / 60000)).padStart(2, '0');
            const seconds = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const milliseconds = String(Math.floor(ms % 1000)).padStart(3, '0');
            return `${minutes}:${seconds}:${milliseconds}`;
        }

        function runTimer() {
            if (timerState !== 'running') return;
            elapsedTime = performance.now() - startTime;
            timerDisplay.innerText = formatTime(elapsedTime);
            timerRaf = requestAnimationFrame(runTimer);
        }

        function resetAndStart() {
            cancelAnimationFrame(timerRaf);
            elapsedTime = 0;
            startTime = performance.now();
            timerState = 'running';
            window.isGameRunning = true;
            window.isGamePaused = false;
            timerWidget.classList.remove('invalid', 'paused');
            timerRaf = requestAnimationFrame(runTimer);
        }

        function pauseCurrentTimer() {
            if (timerState !== 'running') return;
            timerState = 'paused';
            window.isGamePaused = true;
            cancelAnimationFrame(timerRaf);
            timerWidget.classList.add('paused');
        }

        function resumeCurrentTimer() {
            if (timerState !== 'paused') return;
            // Countdown 3 secondi prima di riprendere
            countdownOverlay.classList.add('active');
            let count = 3;
            countdownText.innerText = count;

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                } else if (count === 0) {
                    countdownText.innerText = "GO!";
                } else {
                    clearInterval(countInterval);
                    countdownOverlay.classList.remove('active');
                    timerState = 'running';
                    window.isGamePaused = false;
                    timerWidget.classList.remove('paused');
                    startTime = performance.now() - elapsedTime;
                    timerRaf = requestAnimationFrame(runTimer);
                }
            }, 1000);
        }

        function failTimer() {
            timerState = 'failed';
            window.isGameRunning = false;
            cancelAnimationFrame(timerRaf);
            timerWidget.classList.add('invalid');
            timerWidget.classList.remove('paused');

            if (autoRestartEnabled) {
                setTimeout(() => {
                    restartGameInstance();
                }, 1500);
            }
        }

        function restartGameInstance() {
            timerState = 'idle';
            elapsedTime = 0;
            timerDisplay.innerText = "00:00:000";
            timerWidget.classList.remove('invalid', 'paused');

            // Riavvia Unity direttamente simulando morte/restart o reload rapido
            if (window.activeUnityInstance && window.activeUnityInstance.SendMessage) {
                try {
                    window.activeUnityInstance.SendMessage("GameManager", "RestartGame");
                    return;
                } catch(e) {}
            }
            // Fallback reload istantaneo del canvas
            const canvas = document.querySelector('canvas');
            if (canvas) {
                const spaceEvt = new KeyboardEvent('keydown', { key: ' ', code: 'Space', keyCode: 32, bubbles: true });
                canvas.dispatchEvent(spaceEvt);
            }
        }

        // --- HOOK DIRETTI COLLEGATI AGLI EVENTI DI GIOCO DI SUBWAY SURFERS ---
        window.onSubwayPlay = function() {
            resetAndStart();
        };

        window.onSubwayPause = function() {
            pauseCurrentTimer();
        };

        window.onSubwayResume = function() {
            resumeCurrentTimer();
        };

        window.onCoinCollected = function() {
            failTimer();
        };

        // --- GESTIONE DEI TASTI DI GIOCO (Spazio per iniziare, ESC per fermare) ---
        window.addEventListener('keydown', (e) => {
            // Se preme ESC da tastiera
            if (e.code === 'Escape') {
                if (timerState === 'running') {
                    window.onSubwayPause();
                }
            }
            // Se preme Spazio per fare Play dalla schermata iniziale
            if (e.code === 'Space' && timerState === 'idle') {
                window.onSubwayPlay();
            }
        });

        // Intercetta il click col mouse nell'angolo superiore sinistro del canvas (Icona Settings di Subway)
        window.addEventListener('mousedown', (e) => {
            const canvas = document.querySelector('canvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            
            // Coordinate relative all'interno del gioco
            const clickX = (e.clientX - rect.left) / rect.width;
            const clickY = (e.clientY - rect.top) / rect.height;

            // Se clicca sull'ingranaggio in alto a sinistra di Subway (X < 0.2, Y < 0.2)[cite: 1]
            if (clickX >= 0.02 && clickX <= 0.18 && clickY >= 0.02 && clickY <= 0.18) {
                if (timerState === 'running') {
                    window.onSubwayPause();
                }
            }

            // Se clicca al centro (Play / Tap to Play o Resume)[cite: 1]
            if (timerState === 'paused' && clickX >= 0.35 && clickX <= 0.65 && clickY >= 0.40 && clickY <= 0.70) {
                window.onSubwayResume();
            }
            if (timerState === 'idle' && clickX >= 0.30 && clickX <= 0.70 && clickY >= 0.50 && clickY <= 0.85) {
                window.onSubwayPlay();
            }
        });
    </script>
