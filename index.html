<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krokz no coin</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #18181b; 
            --dot-color: #8b5cf6; 
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: transparent; font-family: 'Inter', sans-serif; user-select: none;
        }

        /* Sfondo a pallini viola */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
            background-size: 30px 30px; z-index: 1; pointer-events: none;
        }

        /* Finestra principale */
        .window-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 85vh; max-width: 1400px; max-height: 850px;
            background: #000; border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8); overflow: hidden;
            transition: all 0.3s ease-in-out; z-index: 10; 
        }

        .window-container.fullscreen {
            width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; border-radius: 0; border: none;
        }

        /* Contenitore del gioco */
        #gameContainer {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; z-index: 1 !important; overflow: hidden !important;
        }
        #gameContainer canvas, #game-container { 
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; object-fit: contain !important;
            outline: none !important; display: block !important; margin: 0 !important; padding: 0 !important; z-index: 1 !important;
        }

        /* --- SCHERMATA DI CARICAMENTO --- */
        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease; color: white;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--dot-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #a1a1aa; animation: pulse 1.5s infinite alternate; }
        .loading-title { font-size: 32px; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .loading-title span { color: var(--dot-color); }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* UI Overlay */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; padding: 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 20px;
            color: var(--text-color); pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-transform: lowercase; display: flex; gap: 6px; }
        .logo .highlight { color: var(--dot-color); }

        .top-right-buttons { display: flex; gap: 12px; }
        
        .btn-icon {
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 12px; border-radius: 12px; transition: background 0.2s;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: white;
        }
        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- WIDGET TIMER --- */
        #timerWidget {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 24px; color: white; cursor: grab;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: border-color 0.3s, color 0.3s, transform 0.1s;
            pointer-events: auto;
        }
        #timerWidget:active { cursor: grabbing; }
        #timerWidget.invalid { border-color: #ef4444; color: #ef4444; }
        #timerWidget.paused { border-color: #eab308; color: #eab308; } /* Giallo se in pausa */

        .timer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #a1a1aa; margin-bottom: 4px; }
        #timerDisplay { font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; transition: font-size 0.2s; }
        
        .timer-controls { display: flex; gap: 8px; margin-top: 8px; }
        .timer-btn { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 6px; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .timer-btn:hover { background: rgba(255,255,255,0.2); }

        /* --- SETTINGS MODAL --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            width: 90%; max-width: 400px; padding: 30px; border-radius: 24px;
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: white; }
        
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; color: white; font-weight: 600;
        }

        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--dot-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-close { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-close:hover { background: #e4e4e7; }

    </style>

    <script type="text/javascript" src="4399.js"></script>
    <script>
        window.config = {
            loader: 'unity', debug: false, maxRatio: 16 / 9, minRatio: 9 / 16, title: 'Subway Surfers',
            unityVersion: '2019.4.18f1', unityWebglBuildUrl: 'Build/SanFrancisco.json', fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143, 'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447, 'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617, 'SanFrancisco.wasm.framework.unityweb': 90693
            }
        };
    </script>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="window-container" id="windowContainer">
        
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-title">krokz<span> no coin</span></div>
            <div class="spinner"></div>
            <div class="loading-text">Loading Game...</div>
        </div>

        <div id="gameContainer" tabindex="0"></div>

        <div class="ui-overlay">
            <div class="glass-panel logo">krokz <span class="highlight">no coin</span></div>
            
            <div class="top-right-buttons">
                <button class="btn-icon glass-panel" id="settingsBtn" title="Settings">
                    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
                <button class="btn-icon glass-panel" id="fullscreenBtn" title="Toggle Fullscreen">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
        </div>

        <div id="timerWidget" class="glass-panel">
            <div class="timer-label">No Coin Timer</div>
            <div id="timerDisplay">00:00:000</div>
            <div class="timer-controls">
                <button class="timer-btn" id="btn-resize-down">-</button>
                <button class="timer-btn" id="btn-resize-up">+</button>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content glass-panel">
                <div class="modal-title">Settings</div>
                
                <div class="setting-row">
                    <span>Auto Restart on Coin</span>
                    <label class="switch">
                        <input type="checkbox" id="autoRestartToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <button class="btn-close" id="closeSettings">Close</button>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="master-loader.js"></script>

    <script>
        // DOM Elements
        const windowContainer = document.getElementById('windowContainer');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const loadingScreen = document.getElementById('loadingScreen');
        const timerWidget = document.getElementById('timerWidget');
        const timerDisplay = document.getElementById('timerDisplay');
        const autoRestartToggle = document.getElementById('autoRestartToggle');

        // Settings State
        let autoRestartEnabled = false;

        // Toggle Settings Modal
        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        closeSettings.addEventListener('click', () => settingsModal.classList.remove('active'));
        autoRestartToggle.addEventListener('change', (e) => {
            autoRestartEnabled = e.target.checked;
            console.log("Auto Restart:", autoRestartEnabled);
        });

        // Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            windowContainer.classList.toggle('fullscreen');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 350);
        });

        // Loading Logic
        let attempts = 0;
        const gameCheckInterval = setInterval(() => {
            attempts++;
            const canvas = document.querySelector('canvas');
            if (canvas) {
                if (!canvas.hasAttribute('data-focus-init')) {
                    canvas.setAttribute('tabindex', '0');
                    canvas.setAttribute('data-focus-init', 'true');
                    canvas.focus();
                    canvas.addEventListener('mousedown', () => canvas.focus());
                }
                if (attempts > 5 && !loadingScreen.classList.contains('hidden')) {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => { if(loadingScreen) loadingScreen.remove(); }, 600);
                }
            }
            const unityWrapper = document.getElementById('game-container');
            if (unityWrapper && unityWrapper.parentElement !== gameContainer) {
                gameContainer.appendChild(unityWrapper);
            }
            if (attempts > 30) clearInterval(gameCheckInterval);
        }, 500);

        // Drag & Drop Timer
        let isDragging = false;
        let offsetX, offsetY;
        timerWidget.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            const rect = timerWidget.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            timerWidget.style.transform = 'none';
            timerWidget.style.left = rect.left + 'px';
            timerWidget.style.top = rect.top + 'px';
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let newX = e.clientX - offsetX;
            let newY = e.clientY - offsetY;
            const containerRect = windowContainer.getBoundingClientRect();
            if (newX < containerRect.left) newX = containerRect.left;
            if (newY < containerRect.top) newY = containerRect.top;
            if (newX + timerWidget.offsetWidth > containerRect.right) newX = containerRect.right - timerWidget.offsetWidth;
            if (newY + timerWidget.offsetHeight > containerRect.bottom) newY = containerRect.bottom - timerWidget.offsetHeight;
            timerWidget.style.left = newX + 'px';
            timerWidget.style.top = newY + 'px';
        });
        document.addEventListener('mouseup', () => { isDragging = false; });

        // Resize Timer
        let currentFontSize = 32;
        document.getElementById('btn-resize-up').addEventListener('click', () => {
            currentFontSize += 4; timerDisplay.style.fontSize = currentFontSize + 'px';
        });
        document.getElementById('btn-resize-down').addEventListener('click', () => {
            if (currentFontSize > 16) { currentFontSize -= 4; timerDisplay.style.fontSize = currentFontSize + 'px'; }
        });

        // --- TIMER STATE MACHINE ---
        // States: 'idle', 'running', 'paused', 'invalid'
        let timerState = 'idle';
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;

        function formatTime(ms) {
            const minutes = String(Math.floor(ms / 60000)).padStart(2, '0');
            const seconds = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const milliseconds = String(Math.floor(ms % 1000)).padStart(3, '0');
            return `${minutes}:${seconds}:${milliseconds}`;
        }

        function updateTimer() {
            if (timerState !== 'running') return;
            elapsedTime = performance.now() - startTime;
            timerDisplay.innerText = formatTime(elapsedTime);
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function startTimer() {
            if (timerState === 'running') return;
            timerState = 'running';
            timerWidget.classList.remove('invalid', 'paused');
            startTime = performance.now() - elapsedTime;
            timerInterval = requestAnimationFrame(updateTimer);
            console.log("Timer Started/Resumed");
        }

        function pauseTimer() {
            if (timerState !== 'running') return;
            timerState = 'paused';
            cancelAnimationFrame(timerInterval);
            timerWidget.classList.add('paused');
            console.log("Timer Paused");
        }

        function resetTimer() {
            timerState = 'idle';
            elapsedTime = 0;
            cancelAnimationFrame(timerInterval);
            timerDisplay.innerText = "00:00:000";
            timerWidget.classList.remove('invalid', 'paused');
            console.log("Timer Reset");
        }

        function stopTimerWithPenalty() {
            timerState = 'invalid';
            cancelAnimationFrame(timerInterval);
            timerWidget.classList.add('invalid');
            timerWidget.classList.remove('paused');
            console.log("Timer Stopped - Invalid Run (Coin)");
        }

        // --- EVENTI DI GIOCO (HOOKS) ---
        
        // Tasto Spazio / ESC
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (timerState === 'idle') startTimer(); // Inizio partita
            }
            if (e.code === 'Escape') {
                pauseTimer(); // Pausa manuale
            }
        });

        // Blur / Focus (Se clicchi fuori dal gioco, si mette in pausa)
        window.addEventListener('blur', () => {
            if (timerState === 'running') pauseTimer();
        });
        window.addEventListener('focus', () => {
            // Non riavviamo automaticamente per evitare cheating, l'utente deve cliccare
            // Ma possiamo riattivarlo se il gioco lo richiede. 
        });

        // Funzioni chiamate da Unity (tramite patch WASM)
        window.onGameStarted = function() {
            resetTimer();
            startTimer();
        };

        window.onGamePaused = function() {
            pauseTimer();
        };

        window.onGameResumed = function() {
            if (timerState === 'paused') startTimer();
        };

        window.onGameOver = function() {
            cancelAnimationFrame(timerInterval);
            // Game Over normale, il timer resta com'è per mostrare il tempo finale
        };

        window.onCoinCollected = function() {
            if (timerState === 'running') {
                stopTimerWithPenalty();
                
                // Se Auto Restart è attivo, resetta il gioco dopo 2 secondi
                if (autoRestartEnabled) {
                    setTimeout(() => {
                        console.log("Auto Restarting...");
                        // Questo comando va mandato a Unity per riavviare
                        // window.unityGame.SendMessage("GameManager", "RestartGame"); 
                        // Per ora ricarichiamo la pagina per simulare il restart
                        window.location.reload(); 
                    }, 2000);
                }
            }
        };

    </script>
</body>
</html>
