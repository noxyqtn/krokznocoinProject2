async function runAutoRestartSequence() {
const canvas = document.querySelector('canvas');
if (!canvas) return;
const triggerClick = (xRatio, yRatio) => {
const rect = canvas.getBoundingClientRect();
const clientX = rect.left + rect.width * xRatio;
const clientY = rect.top + rect.height * yRatio;
const opts = { clientX, clientY, bubbles: true, cancelable: true, view: window, button: 0, buttons: 1 };
canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
canvas.dispatchEvent(new MouseEvent('mousedown', opts));
setTimeout(() => {
canvas.dispatchEvent(new PointerEvent('pointerup', opts));
canvas.dispatchEvent(new MouseEvent('mouseup', opts));
canvas.dispatchEvent(new MouseEvent('click', opts));
}, 25);
};

canvas.dispatchEvent(new KeyboardEvent('keydown', kOpts));
document.dispatchEvent(new KeyboardEvent('keydown', kOpts));
setTimeout(() => {
canvas.dispatchEvent(new KeyboardEvent('keyup', kOpts));
document.dispatchEvent(new KeyboardEvent('keyup', kOpts));
}, 30);
};

const parentRect = windowContainer.getBoundingClientRect();
offsetX = e.clientX - rect.left;
offsetY = e.clientY - rect.top;
timerWidget.style.transform = 'none';

timerWidget.style.top = (rect.top - parentRect.top) + 'px';
});

let newY = e.clientY - parentRect.top - offsetY;
newX = Math.max(10, Math.min(newX, parentRect.width - timerWidget.offsetWidth - 10));
newY = Math.max(10, Math.min(newY, parentRect.height - timerWidget.offsetHeight - 10));
timerWidget.style.left = newX + 'px';

});
document.addEventListener('mouseup', () => { isDragging = false; });
let currentFontSize = 30;
document.getElementById('btn-resize-up').addEventListener('click', function() {
currentFontSize = Math.min(54, currentFontSize + 3);
timerDisplay.style.fontSize = currentFontSize + 'px';
this.blur();
});
document.getElementById('btn-resize-down').addEventListener('click', function() {
currentFontSize = Math.max(18, currentFontSize - 3);
timerDisplay.style.fontSize = currentFontSize + 'px';
this.blur();
});
// --- 6. INPUT TASTIERA ---
window.addEventListener('keydown', (e) => {
if (listeningAction) { assignKey(e); return; }
if (e.code === 'Space' && document.activeElement && document.activeElement.tagName === 'BUTTON') {
document.activeElement.blur();
}
if (e.code === 'KeyC') {
window.onCoinCollected();
return;
}
if (customKeysEnabled && !settingsModal.classList.contains('active')) {
if (e.repeat) return;
let action = null;
for (let act in keybinds) {
if (e.code === keybinds[act]) { action = act; break; }
}
if (action) {
e.preventDefault(); e.stopPropagation();
const arrowMap = { up: ['ArrowUp', 38], down: ['ArrowDown', 40], left: ['ArrowLeft', 37], right: ['ArrowRight', 39] };
const [arrowCode, keyCode] = arrowMap[action];
const downEvent = new KeyboardEvent('keydown', { key: arrowCode, code: arrowCode, keyCode, which: keyCode, bubbles: true, cancelable: true });
const upEvent = new KeyboardEvent('keyup', { key: arrowCode, code: arrowCode, keyCode, which: keyCode, bubbles: true, cancelable: true });
const canvas = document.querySelector('canvas');
if (canvas) { canvas.dispatchEvent(downEvent); canvas.dispatchEvent(upEvent); }
document.dispatchEvent(downEvent); document.dispatchEvent(upEvent);
}
}
});
// --- 7. HOOKS POKI SDK ---
window.onGameStarted = function() { resetTimer(); startTimer(); };
window.onGamePaused = function() { pauseTimer(); };
window.onGameResumed = function() { startTimer(); };
window.onCoinCollected = function() { stopTimerWithPenalty(); };
let sdkHooked = false;
const hookPoki = setInterval(() => {
if (window.PokiSDK && window.PokiSDK.gameplayStart && !sdkHooked) {
const origStart = window.PokiSDK.gameplayStart;
const origStop = window.PokiSDK.gameplayStop;
window.PokiSDK.gameplayStart = function() {
if (timerState === 'paused') window.onGameResumed();
else if (timerState === 'idle' || timerState === 'invalid') window.onGameStarted();
return origStart.apply(this, arguments);
};
window.PokiSDK.gameplayStop = function() {
if (timerState === 'running') window.onGamePaused();
return origStop.apply(this, arguments);
};
sdkHooked = true;
clearInterval(hookPoki);
}
}, 400);
